name: release

on:
  push:
    tags:
      - "v*"

permissions:
  id-token: write # OIDC trusted publishing to npm — no NPM_TOKEN secret
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: npm ci
      - run: npx vitest run
      - run: npm publish --provenance --access public
